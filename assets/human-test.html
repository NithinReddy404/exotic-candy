<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopkeeper test</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfcbc3; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 560px; }
  #ui button { padding: 6px 12px; border: 1px solid #555; border-radius: 6px; background: #fff; cursor: pointer; }
  #ui button.on { background: #4b2a8a; color: #fff; }
  #readout { position: fixed; left: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #dfe; padding: 6px 10px; border-radius: 6px; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre; }
  #tune { position: fixed; right: 8px; top: 8px; width: 280px; max-height: 94vh; overflow: auto; background: rgba(255,255,255,.9); padding: 8px; border-radius: 6px; display: none; }
  #tune label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 4px; font-size: 11px; }
  #tune h4 { margin: 8px 0 2px; }
  #dump { white-space: pre-wrap; font: 10px/1.3 ui-monospace, Consolas, monospace; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <button data-m="idle">idle</button>
  <button data-m="greet">greet</button>
  <button data-m="present">present</button>
  <button id="talk">talk(3000)</button>
  <button id="auto">auto cycle</button>
  <button id="axes">axes</button>
  <button id="tuneBtn">tune</button>
  <button id="fb">force fallback</button>
</div>
<div id="readout">loading...</div>
<div id="tune"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadShopkeeper } from '../scene/human.js';

const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfcbc3);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

// a lit room: floor, back wall, teal slat wall band, counter-height block
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x8d8a85, roughness: 0.7 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), new THREE.MeshStandardMaterial({ color: 0x2ab4c4, roughness: 0.8 }));
wall.position.set(0, 2, -1.6); wall.receiveShadow = true; scene.add(wall);
const key = new THREE.DirectionalLight(0xfff1de, 2.2);
key.position.set(2.5, 4, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 0.5, far: 12 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key, new THREE.HemisphereLight(0xffffff, 0x887f74, 0.7));

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0.45, 1.62, 2.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.update();

const tabletMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x6a3fd0, emissiveIntensity: 0.8, roughness: 0.4 });
const shop = await loadShopkeeper({
  scene, position: new THREE.Vector3(0, 0, 0), rotationY: 0,
  atlasUrl: params.get('fallback') ? 'missing.png' : '../assets/keeper_atlas.png',
  animBase: '../assets/anim/', tabletMaterial: tabletMat,
  onProgress: (p) => { document.getElementById('readout').textContent = 'loading ' + Math.round(p * 100) + '%'; },
});
window.shop = shop; window.camera = camera; window.controls = controls; window.THREE = THREE;

const btns = [...document.querySelectorAll('[data-m]')];
const setActive = (m) => btns.forEach((b) => b.classList.toggle('on', b.dataset.m === m));
for (const b of btns) b.onclick = () => { shop.setMode(b.dataset.m); setActive(b.dataset.m); auto = false; };
document.getElementById('talk').onclick = () => shop.talk(3000);
let auto = false, autoT = 0, autoStep = -1;
document.getElementById('auto').onclick = () => { auto = !auto; autoT = 0; autoStep = -1; };
document.getElementById('fb').onclick = () => { location.search = '?fallback=1'; };
let axes = null;
document.getElementById('axes').onclick = () => {
  if (!shop.bones) return;
  if (axes) { axes.removeFromParent(); axes = null; return; }
  axes = new THREE.AxesHelper(0.2); axes.material.depthTest = false; axes.renderOrder = 10;
  shop.bones.RightHand.add(axes);
};

// tuning panel
const tp = document.getElementById('tune');
document.getElementById('tuneBtn').onclick = () => { tp.style.display = tp.style.display === 'block' ? 'none' : 'block'; };
function slider(parent, label, arr, i, min, max, step) {
  const l = document.createElement('label');
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = arr[i];
  const n = document.createElement('span'); n.textContent = arr[i];
  r.oninput = () => { arr[i] = parseFloat(r.value); n.textContent = r.value; shop.tune.recompute(); };
  l.append(label, r, n); parent.appendChild(l);
}
if (shop.tune && shop.tune.hold) {
  for (const pose of ['hold', 'present']) {
    for (const bone of ['arm', 'fore', 'hand']) {
      const h = document.createElement('h4'); h.textContent = pose + ' ' + bone; tp.appendChild(h);
      ['x', 'y', 'z'].forEach((a, i) => slider(tp, a, shop.tune[pose][bone], i, -180, 180, 1));
    }
  }
  const h = document.createElement('h4'); h.textContent = 'tablet pos / rot'; tp.appendChild(h);
  ['x', 'y', 'z'].forEach((a, i) => slider(tp, 'pos ' + a, shop.tune.tablet.pos, i, -0.25, 0.25, 0.002));
  ['x', 'y', 'z'].forEach((a, i) => slider(tp, 'rot ' + a, shop.tune.tablet.rot, i, -180, 180, 1));
  const h2 = document.createElement('h4'); h2.textContent = 'tablet present pos / rot'; tp.appendChild(h2);
  ['x', 'y', 'z'].forEach((a, i) => slider(tp, 'pos ' + a, shop.tune.tablet.presPos, i, -0.25, 0.25, 0.002));
  ['x', 'y', 'z'].forEach((a, i) => slider(tp, 'rot ' + a, shop.tune.tablet.presRot, i, -180, 180, 1));
  const d = document.createElement('button'); d.textContent = 'dump';
  const pre = document.createElement('div'); pre.id = 'dump';
  d.onclick = () => { pre.textContent = JSON.stringify({ tune: { hold: shop.tune.hold, present: shop.tune.present, tablet: shop.tune.tablet }, quats: shop.tune.quats() }); console.log(pre.textContent); };
  tp.append(d, pre);
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const ro = document.getElementById('readout');
const clock = new THREE.Clock();
let frames = 0, acc = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  controls.update();
  if (auto) {
    autoT += dt;
    const steps = [[0, 'idle'], [6, 'greet'], [13, 'talk'], [19, 'idle']];
    for (let i = steps.length - 1; i >= 0; i--) if (autoT >= steps[i][0]) { if (i !== autoStep) { autoStep = i; if (steps[i][1] === 'talk') shop.talk(3000); else { shop.setMode(steps[i][1]); setActive(steps[i][1]); } } break; }
    if (autoT > 26) autoT = 0;
  }
  shop.update(dt, camera);
  renderer.render(scene, camera);
  acc += dt; frames++;
  if (acc > 0.25) {
    const s = shop.getState();
    ro.textContent = 'mode ' + s.mode + (shop.isFallback ? ' (fallback)' : '') + '\nclips ' + s.clips + '\ngaze ' + s.gaze + '  talking ' + s.talking +
      '\nhead yaw/pitch ' + (s.headYawDeg ?? '-') + ' / ' + (s.headPitchDeg ?? '-') + '  dist ' + (s.dist ?? 0).toFixed(1) + '\nfps ' + Math.round(frames / acc);
    acc = 0; frames = 0;
  }
});
</script>
</body>
</html>
